version: '3.8'

services:
  # ==========================================
  # MakeAWish Backend API Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: makeawish-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
    networks:
      - makeawish-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health/supabase"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================
  # MakeAWish Frontend Web Client (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${SUPABASE_URL:-https://tmxpxssichhpmqszyvlj.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-sb_publishable_4-SRzC8rgrmNKXELvM1U7g_EBhYh_5g}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-google-client-id.apps.googleusercontent.com}
    container_name: makeawish-frontend
    restart: unless-stopped
    ports:
      - "80:80"       # Standard HTTP
      - "5173:80"     # Convenient fallback port
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - makeawish-net

networks:
  makeawish-net:
    driver: bridge
